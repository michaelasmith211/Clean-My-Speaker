<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <circle cx="950" cy="315" r="230" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="950" cy="315" r="175" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.2" stroke-dasharray="8 6"/>
  <circle cx="950" cy="315" r="130" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.35"/>

  <!-- Modern Logo Emblem in OG Graphic -->
  <g transform="translate(800, 165) scale(0.6)">
    <!-- Speaker Body -->
    <rect x="80" y="206" width="38" height="100" rx="15" fill="#ffffff"/>
    <rect x="114" y="218" width="22" height="76" rx="4" fill="#ffffff" opacity="0.95"/>
    <path d="M134,218 L218,154 C228,146 238,153 238,165 L238,347 C238,359 228,366 218,358 L134,294 Z" fill="#ffffff"/>
    <path d="M238,182 C256,208 256,304 238,330 Z" fill="#38bdf8"/>

    <!-- Soundwaves -->
    <path d="M276,198 C298,220 298,292 276,314" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round"/>
    <path d="M322,170 C360,204 360,308 322,342" fill="none" stroke="#60a5fa" stroke-width="16" stroke-linecap="round"/>
    <path d="M368,142 C422,188 422,324 368,370" fill="none" stroke="#818cf8" stroke-width="16" stroke-linecap="round"/>

    <!-- Hero Water Droplet -->
    <g transform="translate(320, 222) rotate(25)">
      <path d="M18,0 C28,14 36,26 36,39 C36,51 27,60 18,60 C9,60 0,51 0,39 C0,26 8,14 18,0 Z" fill="#38bdf8"/>
      <ellipse cx="12" cy="35" rx="5" ry="9" transform="rotate(-18 12 35)" fill="#ffffff" opacity="0.9"/>
    </g>
    <!-- Micro Droplets -->
    <circle cx="396" cy="188" r="9" fill="#38bdf8"/>
    <circle cx="394" cy="186" r="3" fill="#ffffff"/>
    <circle cx="366" cy="318" r="8" fill="#38bdf8"/>
    <circle cx="424" cy="272" r="6" fill="#60a5fa"/>
  </g>

  <rect x="80" y="90" width="310" height="42" rx="21" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <circle cx="106" cy="111" r="5" fill="#38bdf8"/>
  <text x="124" y="117" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1">FREE BROWSER AUDIO UTILITY</text>

  <text x="80" y="210" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
    Clean My Speaker
  </text>
  <text x="80" y="275" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800">
    Online Water Eject &amp; Sound Cleaner
  </text>

  <text x="80" y="340" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
    Play calibrated 165 Hz sound waves to help expel water and moisture
  </text>
  <text x="80" y="375" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
    from iPhone, Android, and mobile speaker openings.
  </text>

  <g transform="translate(80, 440)">
    <rect x="0" y="0" width="180" height="48" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="24" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">⚡ 100% In-Browser</text>

    <rect x="200" y="0" width="165" height="48" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="224" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">🚫 No App Needed</text>

    <rect x="385" y="0" width="175" height="48" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="409" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">🔒 100% Free &amp; Safe</text>
  </g>

  <text x="80" y="555" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">
    cleanmyspeaker.net
  </text>
</svg>
