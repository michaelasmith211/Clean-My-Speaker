<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep High-Tech Midnight -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070e1f"/>
      <stop offset="45%" stop-color="#0c1938"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Outer Squircle Crisp Glow Border -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Solid Crisp Speaker Body Gradient -->
    <linearGradient id="speakerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Transducer Diaphragm Accent -->
    <linearGradient id="diaphragmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Sound Wave Gradients (High Contrast, Razor Sharp) -->
    <linearGradient id="wave1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <linearGradient id="wave2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="wave3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Dynamic Liquid Water Droplet -->
    <linearGradient id="dropletGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Chassis (Full 512x512 with Apple-standard curvature, no blur) -->
  <rect x="4" y="4" width="504" height="504" rx="116" fill="url(#bgGradient)"/>

  <!-- High-Precision Crisp Edge Border -->
  <rect x="4" y="4" width="504" height="504" rx="116" fill="none" stroke="url(#borderGlow)" stroke-width="7"/>

  <!-- Inner Subtle Glass Rim -->
  <rect x="9" y="9" width="494" height="494" rx="112" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- SPEAKER ICON UNIT (Solid, Crisp Geometry) -->
  <g>
    <!-- Rear Magnet Cap -->
    <rect x="64" y="192" width="46" height="128" rx="16" fill="url(#speakerGrad)"/>

    <!-- Magnet Coupling Neck -->
    <rect x="104" y="208" width="28" height="96" rx="5" fill="url(#speakerGrad)"/>

    <!-- Flared Speaker Cone -->
    <path d="M128,208 L228,130 C240,121 252,129 252,144 L252,368 C252,383 240,391 228,382 L128,304 Z" fill="url(#speakerGrad)"/>

    <!-- Vibrating Diaphragm Dome -->
    <path d="M252,164 C278,198 278,314 252,348 Z" fill="url(#diaphragmGrad)"/>

    <!-- Outer rim line for diaphragm definition -->
    <path d="M252,144 C266,158 272,180 272,200 L272,312 C272,332 266,354 252,368" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- CONCENTRIC SOUND WAVES (Bold, High Contrast, 26px Wide, Razor Sharp) -->
  <path d="M300,186 C330,214 330,298 300,326" fill="none" stroke="url(#wave1Grad)" stroke-width="26" stroke-linecap="round"/>
  <path d="M358,148 C406,194 406,318 358,364" fill="none" stroke="url(#wave2Grad)" stroke-width="26" stroke-linecap="round"/>
  <path d="M416,110 C482,174 482,338 416,402" fill="none" stroke="url(#wave3Grad)" stroke-width="26" stroke-linecap="round"/>

  <!-- HERO WATER DROPLET EJECTION (Crisp, High Contrast, Glossy) -->
  <g transform="translate(348, 218) rotate(22)">
    <!-- Droplet Base -->
    <path d="M26,0 C42,20 52,38 52,56 C52,74 39,88 26,88 C13,88 0,74 0,56 C0,38 10,20 26,0 Z" fill="url(#dropletGrad)"/>

    <!-- Specular Highlight Arc (Sharp, not blurred) -->
    <path d="M16,28 C12,38 12,54 18,66" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.95"/>

    <!-- Specular Dot Highlight -->
    <circle cx="31" cy="70" r="4" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- SECONDARY ATOMIZED WATER DROPLET -->
  <g>
    <circle cx="408" cy="336" r="12" fill="url(#dropletGrad)"/>
    <circle cx="404" cy="332" r="3.5" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- PURITY / CLARITY SPARKLE (Crisp 4-Point Star) -->
  <g>
    <path d="M446,146 L450,158 L462,162 L450,166 L446,178 L442,166 L430,162 L442,158 Z" fill="#ffffff"/>
    <circle cx="446" cy="162" r="3" fill="#38bdf8"/>
  </g>
</svg>
